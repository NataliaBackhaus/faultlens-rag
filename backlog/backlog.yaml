  epic: E10
  points: 3
  sprint: 6
  story: As the developer, I want correctness, citation accuracy, faithfulness and abstain rate, so that I can show the answers are right, not just retrieved.
  done_when: make eval reports the four metrics, and a hand check of 20 judge verdicts agrees at least 80% of the time.

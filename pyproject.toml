[project]
name = "faultlens-rag"
version = "0.1.0"
description = "Multimodal RAG assistant for solar inverter troubleshooting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.142.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "ruamel-yaml>=0.19.1",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
